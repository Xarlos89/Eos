line-length = 88

[lint]
select = ["E", "F", "I"]
# The formatter owns line length; E501 only fires on lines it can't break
# (long strings / log messages), so we don't enforce it in the linter.
ignore = ["E501"]
fixable = ["I", "F401"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 72